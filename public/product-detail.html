<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product — Query Cart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/product-detail.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-logo">Query Cart</a>
        <div class="nav-links">
            <a href="products.html">Shop</a>
            <a href="#" id="cartLink">Cart <span class="cart-count" id="cartCount">0</span></a>
        </div>
        <div class="nav-auth" id="navAuth">
            <a href="login.html" class="btn-ghost">Login</a>
            <a href="register.html" class="btn-solid">Register</a>
        </div>
        <div class="nav-user hidden" id="navUser">
            <span id="userName"></span>
            <a href="#" id="logoutBtn" class="btn-ghost">Logout</a>
        </div>
    </nav>

    <!-- BREADCRUMB -->
    <div class="breadcrumb">
        <a href="index.html">Home</a>
        <span>›</span>
        <a href="products.html">Products</a>
        <span>›</span>
        <span id="breadcrumbName">Loading...</span>
    </div>

    <!-- MAIN CONTENT -->
    <div class="detail-wrap" id="detailWrap">
        <div class="spinner"></div>
    </div>

    <!-- REVIEWS SECTION -->
    <div class="reviews-wrap hidden" id="reviewsWrap">
        <div class="reviews-inner">
            <div class="reviews-header">
                <div>
                    <div class="section-eyebrow-d">Customer Feedback</div>
                    <h2 class="reviews-title">Reviews</h2>
                </div>
                <div class="reviews-summary" id="reviewsSummary"></div>
            </div>
            <div class="reviews-list" id="reviewsList"></div>

            <!-- WRITE REVIEW -->
            <div class="write-review hidden" id="writeReview">
                <div class="section-eyebrow-d">Share your experience</div>
                <h3 class="write-review-title">Write a Review</h3>
                <div class="star-picker" id="starPicker">
                    <span class="star-opt" data-val="1">★</span>
                    <span class="star-opt" data-val="2">★</span>
                    <span class="star-opt" data-val="3">★</span>
                    <span class="star-opt" data-val="4">★</span>
                    <span class="star-opt" data-val="5">★</span>
                </div>
                <textarea id="reviewComment" class="review-textarea" placeholder="Tell others what you think about this product..."></textarea>
                <button class="submit-review-btn" id="submitReview">Submit Review</button>
            </div>
            <div class="login-to-review hidden" id="loginToReview">
                <p>Want to leave a review? <a href="login.html">Login here</a></p>
            </div>
        </div>
    </div>

    <!-- RELATED PRODUCTS -->
    <div class="related-wrap hidden" id="relatedWrap">
        <div class="related-inner">
            <div class="section-eyebrow-d">You might also like</div>
            <h2 class="related-title">Related Products</h2>
            <div class="related-grid" id="relatedGrid"></div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/product-detail.js"></script>
</body>
</html>
